name: Build and publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/cn-404-not-found/kindle-dashboard:latest
            ghcr.io/cn-404-not-found/kindle-dashboard:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Smoke test published image
        run: |
          docker run -d --rm --name kindle-smoke -p 127.0.0.1:18080:8080 ghcr.io/cn-404-not-found/kindle-dashboard:${{ github.sha }}
          trap 'docker logs kindle-smoke || true; docker stop kindle-smoke || true' EXIT
          curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-connrefused --max-time 60 http://127.0.0.1:18080/screen.png -o /tmp/screen.png
          python3 -c 'import struct; b=open("/tmp/screen.png","rb").read(26); assert b[:8] == b"\x89PNG\r\n\x1a\n" and struct.unpack(">II", b[16:24]) == (1072, 1448) and b[25] == 0'
