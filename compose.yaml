services:
  kindle-dashboard:
    image: ghcr.io/cn-404-not-found/kindle-dashboard:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      CITY_NAME: "${CITY_NAME:-南宁}"
      TIMEZONE_OFFSET: "${TIMEZONE_OFFSET:-8}"
      OPENCODE_GO_API_KEY: "${OPENCODE_GO_API_KEY:-}"
      OPENCODE_USAGE_INTERVAL: "${OPENCODE_USAGE_INTERVAL:-60}"
